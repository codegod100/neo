# Many src/**/*.rs files do
# `#[doc = include_str!(concat!(env!("CARGO_MANIFEST_DIR"), "/src/doc/string_enum.md"))]`
# and a few do the same for "/src/doc/rich_reply.md" - reindeer's default srcs
# detection only follows `mod` declarations across .rs files, so these
# crate-root-relative files never get picked up.
#
# Cargo.toml itself is also needed: ruma-macros' StringEnum-family derives
# (SerializeAsRefStr, DeserializeFromCowStr, etc) use `proc_macro_crate::crate_name`
# to figure out whether to emit `::ruma_common` or `::ruma::...` paths, which
# reads CARGO_MANIFEST_DIR/Cargo.toml directly - not included in srcs by default.
extra_srcs = ["src/doc/string_enum.md", "src/doc/rich_reply.md", "Cargo.toml"]

# reindeer requires an explicit buildscript.run fixup for every crate
# whose build.rs must actually execute (see docs/MANUAL.md "Build and
# run build.rs build scripts" - buildscript.run has no default and
# reindeer silently omits the build script entirely, rather than
# erroring, when it's left unset).
buildscript.run = true
