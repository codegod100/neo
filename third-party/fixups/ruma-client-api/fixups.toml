# Many src/**/*.rs files do
# `#[doc = include_str!(concat!(env!("CARGO_MANIFEST_DIR"), "/src/doc/string_enum.md"))]`
# - reindeer's default srcs detection only follows `mod` declarations across
# .rs files, so this crate-root-relative file never gets picked up.
#
# Cargo.toml itself is also needed at compile time: ruma-macros' `#[request]`/
# `#[response]` attribute macros (ruma_macros::api::ensure_feature_presence)
# read CARGO_MANIFEST_DIR/Cargo.toml directly to confirm the crate declares
# `client`/`server` features - reindeer doesn't include the manifest in srcs
# by default.
extra_srcs = ["src/doc/string_enum.md", "Cargo.toml"]

# reindeer requires an explicit buildscript.run fixup for every crate
# whose build.rs must actually execute (see docs/MANUAL.md "Build and
# run build.rs build scripts" - buildscript.run has no default and
# reindeer silently omits the build script entirely, rather than
# erroring, when it's left unset).
buildscript.run = true
