# reindeer requires an explicit buildscript.run fixup for every crate
# whose build.rs must actually execute (see docs/MANUAL.md "Build and
# run build.rs build scripts" - buildscript.run has no default and
# reindeer silently omits the build script entirely, rather than
# erroring, when it's left unset).
#
# build.rs compiles a small C helper into a static lib via `cc::Build::compile`
# (which emits its own rustc-link-lib/search) and separately prints
# `cargo:rustc-link-lib=be` for Haiku's libbe - without these, the final
# binary link would be missing those symbols. (This crate is Haiku-only and
# likely isn't actually part of this desktop-Linux build's graph, but the
# fixup is harmless/correct if it ever is.)
[buildscript.run]
rustc_link_lib = true
rustc_link_search = true

[buildscript.run.env]
# build.rs shells out to the `cc` crate, which reads these standard
# Cargo build-profile env vars directly (reindeer's cargo_env only
# covers CARGO_PKG_* - these aren't part of that set).
OPT_LEVEL = "0"
DEBUG = "true"
