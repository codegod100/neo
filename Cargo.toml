[package]
name = "neo"
version = "0.1.0"
edition = "2021"
description = "Neo — matrix.org chat client built with Relm4 (GTK4 + libadwaita)"
license = "MIT"
publish = false

[[bin]]
name = "neo"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
dirs = "6.0.0"
env_logger = "0.11.11"
log = "0.4.33"
eyeball-im = "0.7"
futures-util = "0.3"
matrix-sdk = { version = "0.13", default-features = false, features = ["sqlite", "rustls-tls", "e2e-encryption", "automatic-room-key-forwarding", "sso-login"] }
matrix-sdk-ui = { version = "0.13.0", default-features = false, features = ["rustls-tls"] }
open = "5.3.2"
relm4 = { version = "0.11", default-features = false, features = ["macros", "libadwaita", "gnome_47"] }
# Already pulled in transitively by matrix-sdk-sqlite; taken directly for the
# one-time legacy-store migration in matrix_bridge.rs (see
# `scrub_legacy_to_device_token`). No default features — reuses whatever
# libsqlite3-sys build matrix-sdk-sqlite already resolves to.
rusqlite = { version = "0.35.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
url = "2.5.8"

[dev-dependencies]
# `testing` pulls in matrix-sdk's `test_utils` module (mocked homeserver client
# builders) for dev/test builds only — not linked into the shipped binary.
matrix-sdk = { version = "0.13", default-features = false, features = ["testing"] }
wiremock = "0.6"

# Line tables only for workspace crate; skip debuginfo on deps (link/disk win).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
