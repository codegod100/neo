# This manifest is reindeer's dependency-resolution input only — it is not
# used to `cargo build`/`cargo run`/`cargo test` neo. buck2 (BUCK, third-party/
# BUCK) is the only build tool for that; see README.md's "Building" section.
# Edit this file to add/bump a dependency, then regenerate third-party/BUCK
# per reindeer.toml's instructions - never build straight from this file.
[package]
name = "neo"
version = "0.1.0"
edition = "2021"
description = "Neo — matrix.org chat client built with Relm4 (GTK4 + libadwaita)"
license = "MIT"
publish = false

[[bin]]
name = "neo"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
dirs = "6.0.0"
env_logger = "0.11.11"
log = "0.4.33"
eyeball-im = "0.7"
futures-util = "0.3"
# `testing` (normally a dev-only feature) is enabled unconditionally: reindeer
# only buckifies a package's dev-dependencies for a Cargo `test`-kind target
# ([[test]]/tests/*.rs), and neo is bin-only with its tests living inline in
# src/matrix_bridge.rs's #[cfg(test)] mod (see its comment for why) - there's
# no test-kind target for reindeer to hang wiremock/`testing` off of as a dev
# dependency. `testing` is purely additive (adds matrix-sdk's own test_utils
# module + an optional wiremock dep) and unused outside #[cfg(test)] code, so
# promoting it to a normal dependency costs some extra build time in `//:neo`
# but changes nothing at runtime - see BUCK's `neo-test` rust_test target.
matrix-sdk = { version = "0.13", default-features = false, features = ["sqlite", "rustls-tls", "e2e-encryption", "automatic-room-key-forwarding", "sso-login", "testing"] }
matrix-sdk-ui = { version = "0.13.0", default-features = false, features = ["rustls-tls"] }
open = "5.3.2"
relm4 = { version = "0.11", default-features = false, features = ["macros", "libadwaita", "gnome_47"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
url = "2.5.8"
# Only used from #[cfg(test)] code (see the matrix-sdk `testing` comment
# above) - a normal dependency for the same reindeer/buck2 target-kind reason.
wiremock = "0.6"
