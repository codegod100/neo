# Everything neo's Flutter build needs besides Flutter itself (conda-forge
# has no Flutter package) and flatkit (a git dependency in pubspec.yaml):
# the C/C++ toolchain and GTK for the Linux runner, Rust for vodozemac
# (end-to-end encryption), and sqlite.
#
#   pixi install
#   pixi run linux        # flutter run -d linux inside the environment
[workspace]
name = "neo"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
rust = "*"

# The Linux runner: C/C++ toolchain, GTK 3 and what its pkg-config files
# require. Other platforms build with their own SDKs (Xcode, Visual Studio,
# Android Studio).
[target.linux.dependencies]
clang = "*"
clangxx = "*"
lld = "*"
cmake = "*"
ninja = "*"
pkg-config = "*"
gtk3 = "*"
glib = "*"
zlib = "*"
expat = "*"
sqlite = "*"
# Rewrites the built bundle's library search path; see linux/CMakeLists.txt.
patchelf = "*"

# flutter_vodozemac's build calls rustup, which conda-forge doesn't package;
# tool/bin/rustup stands in for it using this environment's Rust.
[activation.env]
PATH = "$PIXI_PROJECT_ROOT/tool/bin:$PATH"

[tasks]
get = "flutter pub get"
clean-stale-cmake = "tool/clean-stale-cmake"
linux = { cmd = "flutter run -d linux", depends-on = ["get", "clean-stale-cmake"] }
build-linux = { cmd = "flutter build linux --release", depends-on = ["get", "clean-stale-cmake"] }
test = { cmd = "flutter test", depends-on = ["get"] }
