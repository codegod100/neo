name: Flutter

on:
  push:
    paths: ['flutter/**', '.github/workflows/flutter.yml']
  pull_request:
    paths: ['flutter/**', '.github/workflows/flutter.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
