name: Flutter

on:
  push:
    paths: ['flutter/**', '.github/workflows/flutter.yml']
  pull_request:
    paths: ['flutter/**', '.github/workflows/flutter.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: prefix-dev/setup-pixi@v0.11.0
        with:
          manifest-path: flutter/pixi.toml
      - run: pixi run get
      - run: pixi run flutter analyze
      - run: pixi run test
      - run: pixi run build-linux
