name: Publish RBE image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rbe-image.yml"
      - "nix/flake.lock"
      - "nix/flake.nix"

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-rbe-image
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        working-directory: nix
        run: nix build --no-update-lock-file .#neo-rbe-image

      - name: Install image publisher
        run: |
          sudo apt-get update
          sudo apt-get install --yes skopeo

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image
        id: publish
        working-directory: nix
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/neo-rbe
        run: |
          skopeo copy "docker-archive:$(readlink -f result)" "docker://$IMAGE:latest"
          digest="$(skopeo inspect "docker://$IMAGE:latest" --format '{{.Digest}}')"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Published \`$IMAGE@$digest\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify published image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/neo-rbe
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          skopeo inspect "docker://$IMAGE@$DIGEST" >/dev/null
